server:
  port:8080

spring:
  application:
    name: travelbuddy

  # spring.datasource: Configures the connection to the database.
  # It specifies the "where" and "how" to connect.
  datasource:
    url: jdbc:postgresql://localhost:5432/travelbuddy # The database URL (where is the database?)
    username: postgres 
    password: postgres 
    driver-class-name: org.postgresql.Driver # The JDBC driver to use for the connection.

  # spring.jpa: Configures the Java Persistence API (JPA) and its implementation (Hibernate).
  # It defines "how to interact" with the database once connected.
  jpa:
    hibernate:
      # ddl-auto: Defines how the database schema is managed. 'update' automatically updates the schema based on your Java entities.
      ddl-auto: update
    # show-sql: If true, prints the generated SQL queries to the console. Useful for debugging.
    show-sql: true
    properties:
      hibernate:
        # format_sql: If true, formats the printed SQL to be more readable.
        format_sql: true
        # dialect: Specifies the SQL dialect for the target database. This allows Hibernate to generate optimized SQL for PostgreSQL.
        dialect: org.hibernate.dialect.PostgreSQLDialect

  graphql:
    graphiql:
      enabled: true
    path: /graphql

#oauth config
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_APP_ID}
            client-secret: ${FACEBOOK_APP_SECRET}
            scope:
              - email
              - public_profile
            provider: facebook
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v17.0/dialog/oauth
            token-uri: https://graph.facebook.com/v17.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id

jwt:
  secret: ${SECRET_KEY}
  expiration: 86400000 #expiration set for 24hrs
